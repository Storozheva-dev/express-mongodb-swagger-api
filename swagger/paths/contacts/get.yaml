tags:
  - Contacts
summary: Get list of contacts
operationId: getAllContacts
description: Get paginated list of contacts for current user with filtering and sorting.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
    description: Page number for pagination
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
    description: Number of items per page
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [name]
      example: name
    description: Field to sort by (currently only `name`)
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      example: asc
    description: Sort order
  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
      example: work
    description: Filter by contact type
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
    description: Filter contacts by favourite flag
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 2
                perPage:
                  type: integer
                  example: 4
                totalItems:
                  type: integer
                  example: 4
                totalPages:
                  type: integer
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401Unauthorized.yaml'
